name: Strix AI Penetration Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  strix-exploit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Strix CLI
        run: |
          pip install strix-agent

      - name: Run Strix Penetration Testing (Exploit & Report)
        env:
          # Mengatur model GLM-5.3-Flash via Environment Variable (sesuai spesifikasi litellm/strix)
          STRIX_LLM: "openrouter/z-ai/glm-5.3-flash" # Atau sesuaikan provider Anda (misal: "together_ai/zai-org/glm-5.3-flash")
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          # Perintah CLI yang valid sesuai argumen resmi Strix
          # --scan-mode deep memicu siklus eksploitasi penuh (ReAct loop)
          strix -n \
            --target . \
            --scan-mode deep \
            --scope-mode full
